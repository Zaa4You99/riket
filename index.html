<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riket - Risol Roket | Menu Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-32">

  <!-- Header & Brand Riket -->
  <header class="bg-gradient-to-r from-orange-600 to-red-600 p-6 rounded-b-3xl shadow-lg text-center relative overflow-hidden">
    <div class="relative z-10">
      <div class="inline-block bg-white text-orange-600 p-3 rounded-full mb-2 shadow-md">
        <i class="fa-solid fa-rocket text-3xl"></i>
      </div>
      <h1 class="text-3xl font-extrabold tracking-wider">RIKET</h1>
      <p class="text-orange-100 text-sm font-medium">Risol Roket - By kelompok 6 !!!</p>
    </div>
  </header>

  <!-- Input Nama Pemesan -->
  <div class="max-w-md mx-auto px-4 mt-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow-md flex items-center justify-between gap-3">
      <label for="customer-name" class="text-sm font-semibold text-gray-300 flex items-center shrink-0">
        <i class="fa-solid fa-user text-orange-500 mr-2"></i>Nama Pemesan:
      </label>
      <input type="text" id="customer-name" placeholder="Masukkan nama..." class="bg-gray-900 border border-orange-500 text-white font-bold text-center w-full py-1.5 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-400">
    </div>
  </div>

  <!-- Menu Section -->
  <main class="max-w-md mx-auto px-4 mt-6">
    <h2 class="text-lg font-bold mb-4 border-l-4 border-orange-500 pl-3">Pilihan Risol Roket</h2>
    
    <div id="menu-container" class="space-y-4">
      <!-- Item Menu di-render via JavaScript -->
    </div>
  </main>

  <!-- Bottom Bar Total & Pesan -->
  <div class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 p-4 shadow-2xl z-50">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-400">Total Pesanan</p>
        <p id="total-price" class="text-xl font-extrabold text-orange-400">Rp 0</p>
      </div>
      <button onclick="sendOrder()" class="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-3 px-6 rounded-2xl shadow-lg flex items-center gap-2 active:scale-95 transition">
        <i class="fa-brands fa-whatsapp text-lg"></i>
        <span>Kirim Pesanan</span>
      </button>
    </div>
  </div>

  <script>
    // Nomor WhatsApp usaha kamu
    const ADMIN_WA = "62881027362553";

    const menuItems = [
      {
        id: 1,
        name: "Riket Mayo Classic",
        desc: "Smoked beef, telur, & mayo gurih melimpah.",
        price: 5000,
        image: "mayo.jpg"
      },
      {
        id: 2,
        name: "Riket Pedas Meluncur",
        desc: "Ayam suwir pedas mercon bikin nampol.",
        price: 6000,
        image: "pedas.jpg"
      },
      {
        id: 3,
        name: "Riket Keju Lumer",
        desc: "Isian keju mozzarella & saus keju gurih.",
        price: 7000,
        image: "keju.jpg"
      },
      {
        id: 4,
        name: "Es Teh Solo Roket",
        desc: "Segarnya teh melati khas pendamping Riket.",
        price: 3000,
        image: "esteh.jpg",
        hasOptions: true
      }
    ];

    let cart = {};
    let options = {
      4: "Normal Sugar" // Default opsi gula Es Teh
    };

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = menuItems.map(item => `
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-3 shadow-md flex flex-col gap-2">
          <div class="flex gap-3 items-center">
            <img src="${item.image}" alt="${item.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Foto+Produk';" class="w-20 h-20 object-cover rounded-xl border border-gray-700">
            <div class="flex-1">
              <h3 class="font-bold text-white text-base">${item.name}</h3>
              <p class="text-xs text-gray-400 mt-0.5 line-clamp-2">${item.desc}</p>
              <p class="text-orange-400 font-extrabold text-sm mt-1">Rp ${item.price.toLocaleString('id-ID')}</p>
            </div>
            <div class="flex items-center gap-2 bg-gray-900 border border-gray-700 rounded-xl p-1">
              <button onclick="updateCart(${item.id}, -1)" class="w-7 h-7 bg-gray-800 rounded-lg flex items-center justify-center text-orange-400 font-bold active:bg-gray-700">-</button>
              <span id="qty-${item.id}" class="text-sm font-bold w-4 text-center">${cart[item.id] || 0}</span>
              <button onclick="updateCart(${item.id}, 1)" class="w-7 h-7 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold active:bg-orange-600">+</button>
            </div>
          </div>

          <!-- Opsi Level Gula khusus Es Teh -->
          ${item.hasOptions ? `
            <div id="options-container-${item.id}" class="${cart[item.id] ? 'block' : 'hidden'} mt-1 pt-2 border-t border-gray-700/60">
              <label class="text-xs font-semibold text-gray-300 block mb-1">Pilih Takaran Gula:</label>
              <div class="grid grid-cols-3 gap-1.5">
                <button type="button" onclick="selectOption(${item.id}, 'Less Sugar')" id="opt-${item.id}-Less Sugar" class="option-btn text-xs py-1 px-2 rounded-lg border border-gray-600 bg-gray-900 text-gray-300 font-medium active:scale-95 transition">Less Sugar</button>
                <button type="button" onclick="selectOption(${item.id}, 'Normal Sugar')" id="opt-${item.id}-Normal Sugar" class="option-btn text-xs py-1 px-2 rounded-lg border border-orange-500 bg-orange-500 text-white font-bold active:scale-95 transition">Normal</button>
                <button type="button" onclick="selectOption(${item.id}, 'Extra Sugar')" id="opt-${item.id}-Extra Sugar" class="option-btn text-xs py-1 px-2 rounded-lg border border-gray-600 bg-gray-900 text-gray-300 font-medium active:scale-95 transition">Extra Sugar</button>
              </div>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function selectOption(itemId, val) {
      options[itemId] = val;
      
      // Update UI tombol opsi
      const optionsList = ['Less Sugar', 'Normal Sugar', 'Extra Sugar'];
      optionsList.forEach(opt => {
        const btn = document.getElementById(`opt-${itemId}-${opt}`);
        if (btn) {
          if (opt === val) {
            btn.className = "option-btn text-xs py-1 px-2 rounded-lg border border-orange-500 bg-orange-500 text-white font-bold active:scale-95 transition";
          } else {
            btn.className = "option-btn text-xs py-1 px-2 rounded-lg border border-gray-600 bg-gray-900 text-gray-300 font-medium active:scale-95 transition";
          }
        }
      });
    }

    function updateCart(id, change) {
      if (!cart[id]) cart[id] = 0;
      cart[id] += change;

      if (cart[id] <= 0) {
        delete cart[id];
      }

      document.getElementById(`qty-${id}`).innerText = cart[id] || 0;

      // Sembunyikan / tampilkan opsi gula tergantung jumlah pesanan
      const optContainer = document.getElementById(`options-container-${id}`);
      if (optContainer) {
        if (cart[id] > 0) {
          optContainer.classList.remove('hidden');
          optContainer.classList.add('block');
        } else {
          optContainer.classList.remove('block');
          optContainer.classList.add('hidden');
        }
      }

      calculateTotal();
    }

    function calculateTotal() {
      let total = 0;
      for (const id in cart) {
        const item = menuItems.find(m => m.id == id);
        total += item.price * cart[id];
      }
      document.getElementById('total-price').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function sendOrder() {
      const customerName = document.getElementById('customer-name').value.trim();
      
      if (!customerName) {
        alert("Mohon isi Nama Pemesan terlebih dahulu!");
        return;
      }

      const selectedItems = Object.keys(cart);
      if (selectedItems.length === 0) {
        alert("Pilih minimal 1 menu Riket!");
        return;
      }

      let message = `* [ PESANAN BARU - RIKET ] *\n`;
      message += `-----------------------------------\n`;
      message += `-> *Nama Pemesan:* ${customerName}\n`;
      message += `-----------------------------------\n\n`;
      message += `*DETAIL PESANAN:*\n`;

      let total = 0;
      selectedItems.forEach(id => {
        const item = menuItems.find(m => m.id == id);
        const subtotal = item.price * cart[id];
        total += subtotal;
        
        let itemDetail = `• *${item.name}* (x${cart[id]}) = Rp ${subtotal.toLocaleString('id-ID')}`;
        if (item.hasOptions && options[id]) {
          itemDetail += `\n  └ *Opsi Gula:* ${options[id]}`;
        }
        message += itemDetail + `\n`;
      });

      message += `\n-----------------------------------\n`;
      message += `-> *TOTAL BAYAR:* *Rp ${total.toLocaleString('id-ID')}*\n\n`;
      message += `Mohon segera diproses ya kak! Terima kasih.`;

      const encodedMessage = encodeURIComponent(message);
      window.open(`https://wa.me/${ADMIN_WA}?text=${encodedMessage}`, '_blank');
    }

    renderMenu();
  </script>
</body>
</html>
